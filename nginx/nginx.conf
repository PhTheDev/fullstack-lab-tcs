resolver 127.0.0.11 valid=10s;
server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # Frontend (Vite) – resolve "frontend" no momento da requisição (evita erro se o container ainda não existir ao subir o nginx)
    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header WebSocket-Key $http_sec_websocket_key;
        proxy_set_header WebSocket-Version $http_sec_websocket_version;
    }

    # API – requisições em /api/* vão para o backend como /*
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
